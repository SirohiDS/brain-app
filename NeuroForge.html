/* --- Code Breaker (Mastermind deduction) --- */
function chCodeBreaker(n,total){
  const len = clamp(3 + Math.floor(S.skill.reasoning/4), 3, 5);
  const palette = ['🔴','🟡','🟢','🔵','🟣','🟠'].slice(0, clamp(4+Math.floor(S.skill.reasoning/5),4,6));
  const secret = Array.from({length:len}, ()=>pick(palette));
  const maxGuess = 6;
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Code Breaker','Reasoning')}
    <p class="big">Crack the ${len}-colour code in ${maxGuess} guesses. After each guess:
      <b>●</b> = right colour, right spot · <b>○</b> = right colour, wrong spot.</p>
    <div id="cbRows" class="cbRows"></div>
    <div class="cbCurrent" id="cbCur"></div>
    <div class="palette" id="cbPal">${palette.map(p=>`<button data-p="${p}">${p}</button>`).join('')}</div>
    <div class="center mt">
      <button class="btn small secondary" id="cbUndo">⌫ Undo</button>
      <button class="btn small" id="cbGo" disabled>Submit guess</button>
    </div>
    <div class="feedback"></div>
  </div>`);
  let cur=[], guesses=0;
  const rows=$('cbRows'), curEl=$('cbCur'), go=$('cbGo');
  function drawCur(){
    curEl.innerHTML = Array.from({length:len},(_,i)=>
      `<span class="cbSlot">${cur[i]||''}</span>`).join('');
    go.disabled = cur.length!==len;
  }
  drawCur();
  $('cbPal').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ if(cur.length<len){ cur.push(b.dataset.p); drawCur(); } };
  });
  $('cbUndo').onclick=()=>{ cur.pop(); drawCur(); };
  function scoreGuess(g){
    const s=secret.slice(), gg=g.slice();
    let black=0, white=0;
    for(let i=len-1;i>=0;i--){ if(gg[i]===s[i]){ black++; s.splice(i,1); gg.splice(i,1); } }
    gg.forEach(x=>{ const j=s.indexOf(x); if(j>-1){ white++; s.splice(j,1); } });
    return {black, white};
  }
  function finish(won){
    rows.insertAdjacentHTML('beforeend',
      `<div class="cbRow"><span class="cbGuess">${secret.join('')}</span><span class="cbPegs">answer</span></div>`);
    // Full marks for cracking it in ≤3, scaling down to 0 for a total miss.
    const score = won? clamp(1 - (guesses-1)*0.14, 0.35, 1) : 0;
    addScore('reasoning', score, 110); adaptSkill('reasoning');
    showFeedback(c, won, (won? `✅ Cracked in ${guesses} guess${guesses>1?'es':''}.` : `❌ Out of guesses — the code was ${secret.join('')}.`) +
      ' Strategy: your first guess should use as many <i>different</i> colours as possible — it buys the most information. ' +
      'Then change exactly one position at a time so each result isolates a single variable.');
  }
  go.onclick=()=>{
    if(cur.length!==len) return;
    guesses++;
    const {black,white} = scoreGuess(cur);
    rows.insertAdjacentHTML('beforeend',
      `<div class="cbRow"><span class="cbGuess">${cur.join('')}</span><span class="cbPegs">${'●'.repeat(black)}${'○'.repeat(white)}${black+white===0?'—':''}</span></div>`);
    if(black===len){ finish(true); return; }
    if(guesses>=maxGuess){ finish(false); return; }
    cur=[]; drawCur();
  };
}

/* --- Knights & Knaves (truth-teller logic) --- */
function chKnightsKnaves(n,total){
  // Knights always tell the truth, knaves always lie. Generated so exactly one
  // assignment is consistent — verified by brute force before it's shown.
  const people = sample(NAMES, 3);
  const [A,B,C] = people;
  /* Every template below is uniquely solvable — verified by the brute-force check
     under it, and by a property test over hundreds of runs. Two earlier drafts
     ("I am a knave", and the at-least-one variant) were self-contradictory and had
     ZERO valid assignments, so they always fell through to the fallback. */
  const templates = [
    { build:()=>({
        lines:[`${A}: "${B} is a knave."`, `${B}: "${A} and I are both knights."`],
        check:(a,b)=> (a === (b===false)) && (b === (a===true && b===true))
      })},
    { build:()=>({
        lines:[`${A}: "We are both knaves."`, `${B}: "${A} is a knave."`],
        check:(a,b)=> (a === (a===false && b===false)) && (b === (a===false))
      })},
    { build:()=>({
        lines:[`${A}: "${B} is a knight."`, `${B}: "${A} and I are different types."`],
        check:(a,b)=> (a === (b===true)) && (b === (a!==b))
      })},
    { build:()=>({
        lines:[`${A}: "${B} and I are the same type."`, `${B}: "${A} is a knave."`],
        check:(a,b)=> (a === (a===b)) && (b === (a===false))
      })},
    { build:()=>({
        lines:[`${A}: "Exactly one of us is a knight."`, `${B}: "${A} is a knave."`],
        check:(a,b)=> (a === (a!==b)) && (b === (a===false))
      })},
    { build:()=>({
        lines:[`${A}: "If I am a knight, then ${B} is a knight."`, `${B}: "${A} is a knight."`],
        check:(a,b)=> (a === (a===false || b===true)) && (b === (a===true))
      })}
  ];
  const t = pick(templates).build();
  // Brute-force every assignment; keep only puzzles with a unique solution.
  const sols = [];
  for(const a of [true,false]) for(const b of [true,false]) if(t.check(a,b)) sols.push([a,b]);
  if(sols.length!==1){ return chSyllogism(n,total); }  // fall back rather than show a broken puzzle
  const [solA, solB] = sols[0];
  const options = [
    {t:`${A} knight · ${B} knight`, a:true,  b:true},
    {t:`${A} knight · ${B} knave`,  a:true,  b:false},
    {t:`${A} knave · ${B} knight`,  a:false, b:true},
    {t:`${A} knave · ${B} knave`,   a:false, b:false}
  ];
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Knights & Knaves','Reasoning')}
    <p class="big">On this island <b>knights always tell the truth</b> and <b>knaves always lie</b>. Who is who?</p>
    <div class="logicBox">${t.lines.map(l=>`<p class="logicLine">${esc(l)}</p>`).join('')}</div>
    <div class="choices">${options.map((o,i)=>`<div class="choice" data-i="${i}">${esc(o.t)}</div>`).join('')}</div>
    <div class="feedback"></div>
  </div>`);
  const t0=Date.now();
  c.querySelectorAll('.choice').forEach(el=>{
    el.onclick=()=>{
      if(c.querySelector('.choice.correct')) return;
      const o = options[+el.dataset.i];
      const right = (o.a===solA && o.b===solB);
      c.querySelectorAll('.choice').forEach((x,i)=>{
        const oo=options[i];
        if(oo.a===solA && oo.b===solB) x.classList.add('correct');
        else if(x===el) x.classList.add('wrong');
      });
      const secs=(Date.now()-t0)/1000;
      const score = right? clamp(1-Math.max(0,secs-30)/70, 0.5, 1) : 0;
      addScore('reasoning', score, 100); adaptSkill('reasoning');
      showFeedback(c, right, (right?'✅ Correct. ':'❌ Not quite. ') +
        `${A} is a <b>${solA?'knight':'knave'}</b> and ${B} is a <b>${solB?'knight':'knave'}</b>. ` +
        'Method: assume a speaker is a knight, follow the consequences, and look for a contradiction. ' +
        'If you find one, they must be a knave. Testing an assumption to destruction is the whole trick.');
    };
  });
}

/* --- Syllogism validity --- */
function chSyllogism(n,total){
  const groups = ['artists','engineers','cyclists','bakers','pilots','poets','divers','chemists'];
  const traits = ['left-handed','early risers','vegetarians','night owls','marathon runners','chess players'];
  const [G1,G2] = sample(groups,2); const T = pick(traits);
  // Deliberately mixes valid forms with classic fallacies (affirming the consequent, etc.)
  const forms = [
    {p:[`All ${G1} are ${T}.`, `All ${T} are ${G2}.`], conc:`All ${G1} are ${G2}.`, valid:true,
     why:'This is Barbara — a valid chain. Both premises are universal and the middle term links them.'},
    {p:[`All ${G1} are ${T}.`, `Some ${T} are ${G2}.`], conc:`Some ${G1} are ${G2}.`, valid:false,
     why:'Invalid. The "some" overlaps might sit entirely outside the ' + G1 + ' part of the ' + T + ' group.'},
    {p:[`No ${G1} are ${T}.`, `All ${G2} are ${T}.`], conc:`No ${G1} are ${G2}.`, valid:true,
     why:'Valid. If every ' + G2 + ' sits inside ' + T + ', and no ' + G1 + ' does, the two groups cannot touch.'},
    {p:[`Some ${G1} are ${T}.`, `Some ${T} are ${G2}.`], conc:`Some ${G1} are ${G2}.`, valid:false,
     why:'Invalid — two "some" premises never guarantee a conclusion. The overlaps can be different people entirely.'},
    {p:[`All ${G1} are ${T}.`, `No ${T} are ${G2}.`], conc:`No ${G1} are ${G2}.`, valid:true,
     why:'Valid. ' + G1 + ' is fully inside ' + T + ', and ' + T + ' is fully excluded from ' + G2 + '.'},
    {p:[`All ${G1} are ${T}.`, `Some ${G2} are ${T}.`], conc:`Some ${G2} are ${G1}.`, valid:false,
     why:'Invalid — this is affirming the consequent. Being ' + T + ' does not make you one of the ' + G1 + '.'}
  ];
  const f = pick(forms);
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Is the logic valid?','Reasoning')}
    <p class="big">Assume both premises are true — even if they sound absurd. Does the conclusion <i>have</i> to follow?</p>
    <div class="logicBox">
      ${f.p.map(x=>`<p class="logicLine">${esc(x)}</p>`).join('')}
      <p class="logicLine conc">∴ ${esc(f.conc)}</p>
    </div>
    <div class="choices">
      <div class="choice" data-v="1">✅ Valid — it must follow</div>
      <div class="choice" data-v="0">❌ Invalid — it might not</div>
    </div>
    <div class="feedback"></div>
  </div>`);
  const t0=Date.now();
  c.querySelectorAll('.choice').forEach(el=>{
    el.onclick=()=>{
      if(c.querySelector('.choice.correct')) return;
      const said = el.dataset.v==='1';
      const right = said===f.valid;
      c.querySelectorAll('.choice').forEach(x=>{
        if((x.dataset.v==='1')===f.valid) x.classList.add('correct'); else if(x===el) x.classList.add('wrong');
      });
      const secs=(Date.now()-t0)/1000;
      const score = right? clamp(1-Math.max(0,secs-18)/45, 0.5, 1) : 0;
      addScore('reasoning', score, 85); adaptSkill('reasoning');
      showFeedback(c, right, (right?'✅ ':'❌ ') + f.why +
        ' Tip: draw the two circles. If you can sketch <i>any</i> arrangement where the premises hold but the conclusion fails, it is invalid.');
    };
  });
}

/* --- Mini Latin Square (sudoku-style constraint solving) --- */
function chLatinSquare(n,total){
  const size = S.skill.reasoning>=7? 5 : 4;
  const glyphs = ['🍋','🍇','🍊','🫐','🍏'].slice(0,size);
  // Build a valid latin square by cyclic shift, then shuffle rows/cols/symbols.
  let sq = Array.from({length:size},(_,r)=>Array.from({length:size},(_,c)=>(r+c)%size));
  shuffle([0,1,2]).forEach(()=>{
    const order = shuffle(Array.from({length:size},(_,i)=>i));
    sq = order.map(r=>sq[r]);
    const cOrder = shuffle(Array.from({length:size},(_,i)=>i));
    sq = sq.map(row=>cOrder.map(ci=>row[ci]));
  });
  const blanks = clamp(3 + Math.floor(S.skill.reasoning/3), 3, size+2);
  const cells = shuffle(Array.from({length:size*size},(_,i)=>i)).slice(0,blanks);
  const hidden = new Set(cells);
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Latin Square','Reasoning')}
    <p class="big">Fill every blank so each symbol appears <b>exactly once in every row and every column</b>. Tap a blank, then tap a symbol.</p>
    <div class="lsGrid" id="lsGrid" style="grid-template-columns:repeat(${size},minmax(0,1fr)); max-width:${size*62}px;">
      ${sq.flatMap((row,r)=>row.map((v,cc)=>{
        const i=r*size+cc;
        return hidden.has(i)
          ? `<div class="lsCell blank" data-i="${i}" data-v=""></div>`
          : `<div class="lsCell given">${glyphs[v]}</div>`;
      })).join('')}
    </div>
    <div class="palette" id="lsPal">${glyphs.map((g,i)=>`<button data-v="${i}">${g}</button>`).join('')}</div>
    <div class="center mt"><button class="btn" id="lsGo">Check solution</button></div>
    <div class="feedback"></div>
  </div>`);
  let sel=null; const t0=Date.now();
  c.querySelectorAll('.lsCell.blank').forEach(el=>{
    el.onclick=()=>{ c.querySelectorAll('.lsCell').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); sel=el; };
  });
  $('lsPal').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ if(!sel) return; sel.dataset.v=b.dataset.v; sel.textContent=glyphs[+b.dataset.v]; };
  });
  $('lsGo').onclick=()=>{
    let correct=0;
    c.querySelectorAll('.lsCell.blank').forEach(el=>{
      const i=+el.dataset.i, want=sq[Math.floor(i/size)][i%size];
      const got = el.dataset.v===''? -1 : +el.dataset.v;
      if(got===want){ correct++; el.classList.add('ok'); } else { el.classList.add('no'); el.textContent=glyphs[want]; }
    });
    const score = correct/blanks;
    const secs=(Date.now()-t0)/1000;
    addScore('reasoning', score * clamp(1-Math.max(0,secs-70)/120, 0.6, 1), 120);
    adaptSkill('reasoning');
    showFeedback(c, score>=0.8, `${correct} of ${blanks} blanks correct. ` +
      'Technique: never guess — find the row or column that already has the most symbols filled in and solve that one first. ' +
      'Each certainty you place creates new certainties elsewhere.');
  };
}

/* --- Minesweeper-style deduction --- */
function chMineDeduce(n,total){
  const size = 4;
  const mineCount = clamp(3 + Math.floor(S.skill.reasoning/4), 3, 6);
  const mines = new Set(sample(Array.from({length:size*size},(_,i)=>i), mineCount));
  const neighbours = i=>{
    const r=Math.floor(i/size), cc=i%size, out=[];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr && !dc) continue;
      const nr=r+dr, nc=cc+dc;
      if(nr>=0&&nr<size&&nc>=0&&nc<size) out.push(nr*size+nc);
    }
    return out;
  };
  const counts = Array.from({length:size*size},(_,i)=>
    mines.has(i)? -1 : neighbours(i).filter(j=>mines.has(j)).length);
  // Reveal a set of safe numbered cells; the player flags the mines.
  const safeCells = Array.from({length:size*size},(_,i)=>i).filter(i=>!mines.has(i));
  const revealed = new Set(sample(safeCells, Math.min(safeCells.length, size*size-mineCount-1)));
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Mine Logic','Reasoning')}
    <p class="big">Each number counts the mines touching it (including diagonals). Flag all <b>${mineCount}</b> mines. No guessing needed — it is fully deducible.</p>
    <div class="lsGrid" id="msGrid" style="grid-template-columns:repeat(${size},minmax(0,1fr)); max-width:${size*62}px;">
      ${Array.from({length:size*size},(_,i)=>revealed.has(i)
        ? `<div class="lsCell given">${counts[i]||''}</div>`
        : `<div class="lsCell blank ms" data-i="${i}"></div>`).join('')}
    </div>
    <p class="center" id="msLeft">Flags placed: 0 / ${mineCount}</p>
    <div class="center mt"><button class="btn" id="msGo">Check</button></div>
    <div class="feedback"></div>
  </div>`);
  const flags=new Set(); const t0=Date.now();
  c.querySelectorAll('.ms').forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i;
      if(flags.has(i)){ flags.delete(i); el.textContent=''; el.classList.remove('flag'); }
      else { flags.add(i); el.textContent='🚩'; el.classList.add('flag'); }
      setText('msLeft', `Flags placed: ${flags.size} / ${mineCount}`);
    };
  });
  $('msGo').onclick=()=>{
    let hit=0, wrong=0;
    flags.forEach(i=>{ if(mines.has(i)) hit++; else wrong++; });
    c.querySelectorAll('.ms').forEach(el=>{
      const i=+el.dataset.i;
      if(mines.has(i)){ el.classList.add(flags.has(i)?'ok':'no'); el.textContent='💣'; }
      else if(flags.has(i)){ el.classList.add('no'); }
    });
    const score = clamp((hit - wrong*0.5)/mineCount, 0, 1);
    const secs=(Date.now()-t0)/1000;
    addScore('reasoning', score * clamp(1-Math.max(0,secs-60)/110, 0.6, 1), 115);
    adaptSkill('reasoning');
    showFeedback(c, score>=0.75, `${hit} of ${mineCount} mines found${wrong?`, ${wrong} false flag${wrong>1?'s':''}`:''}. ` +
      'Core technique: find a number whose count equals its remaining unknown neighbours — every one of those is a mine. ' +
      'Then find a number already satisfied by its flags — all its other neighbours are safe. Alternate the two rules.');
  };
}

/* --- Word Deduction (Wordle-style) --- */
function chWordDeduce(n,total){
  const bank = WORDS.filter(w=>w.length===6);
  const secret = pick(bank).toUpperCase();
  const maxGuess = 5;
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Word Deduction','Reasoning')}
    <p class="big">Guess the 6-letter word in ${maxGuess} tries.
      <span class="wdKey wdHit">A</span> right letter, right spot ·
      <span class="wdKey wdNear">A</span> right letter, wrong spot ·
      <span class="wdKey wdMiss">A</span> not in the word.</p>
    <div id="wdRows"></div>
    <input type="text" id="wdIn" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="6 letters">
    <div class="center mt"><button class="btn" id="wdGo">Guess</button>
      <button class="btn secondary small" id="wdGiveUp">Reveal (score 0)</button></div>
    <p class="center" id="wdLetters" style="font-size:12px; color:var(--dim); margin-top:10px;"></p>
    <div class="feedback"></div>
  </div>`);
  let guesses=0; const used={};
  function mark(g){
    const s=secret.split(''), res=Array(6).fill('miss');
    for(let i=0;i<6;i++) if(g[i]===s[i]){ res[i]='hit'; s[i]=null; }
    for(let i=0;i<6;i++){
      if(res[i]==='hit') continue;
      const j=s.indexOf(g[i]);
      if(j>-1){ res[i]='near'; s[j]=null; }
    }
    return res;
  }
  function finish(won){
    const score = won? clamp(1-(guesses-1)*0.16, 0.3, 1) : 0;
    addScore('reasoning', score, 105); adaptSkill('reasoning');
    $('wdGo').disabled=true;
    showFeedback(c, won, (won? `✅ Got it in ${guesses}.` : `❌ The word was <b>${secret}</b>.`) +
      ' Strategy: spend guess one on a word packed with common vowels and consonants (like ORATES) — ' +
      'maximum information beats a lucky stab. Only start narrowing once you have 3+ confirmed letters.');
  }
  function submit(){
    const raw = ($('wdIn').value||'').toUpperCase().replace(/[^A-Z]/g,'');
    if(raw.length!==6){ toast('Needs to be 6 letters'); return; }
    guesses++;
    const res = mark(raw);
    res.forEach((r,i)=>{ const L=raw[i]; if(used[L]!=='hit') used[L]= r==='hit'?'hit': (r==='near'&&used[L]!=='hit'?'near':(used[L]||'miss')); });
    $('wdRows').insertAdjacentHTML('beforeend',
      `<div class="wdRow">${raw.split('').map((L,i)=>`<span class="wdKey wd${res[i][0].toUpperCase()+res[i].slice(1)}">${L}</span>`).join('')}</div>`);
    setText('wdLetters', 'Ruled out: ' + (Object.keys(used).filter(k=>used[k]==='miss').sort().join(' ') || '—'));
    $('wdIn').value='';
    if(res.every(r=>r==='hit')){ finish(true); return; }
    if(guesses>=maxGuess){ finish(false); }
  }
  $('wdGo').onclick=submit;
  $('wdIn').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  $('wdGiveUp').onclick=()=>{ guesses=maxGuess; finish(false); };
}

/* --- Sentence Reconstruction --- */
function chSentenceOrder(n,total){
  const SENTENCES = [
    'the harbor lights flickered long after the last ferry departed',
    'she folded the map carefully and put it back in her coat',
    'every morning the baker opened the shutters before sunrise',
    'the old telescope still points at the same patch of sky',
    'nobody expected the river to freeze quite so early this year',
    'he memorised the entire route without writing anything down',
    'the letter arrived three weeks after it had been posted',
    'a small crowd gathered to watch the clock tower strike noon'
  ];
  const sentence = pick(SENTENCES);
  const words = sentence.split(' ');
  const scrambled = (()=>{ let s=shuffle(words); let guard=0;
    while(s.join(' ')===sentence && guard++<20) s=shuffle(words); return s; })();
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Sentence Rebuild','Reasoning')}
    <p class="big">Tap the words in the right order to rebuild the sentence. Tap a word in your answer to send it back.</p>
    <div class="sentBuild" id="sentBuild"><span class="sentHint">your sentence…</span></div>
    <div class="sentPool" id="sentPool">${scrambled.map((w,i)=>`<button class="sentWord" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>
    <div class="center mt"><button class="btn" id="sentGo">Submit</button></div>
    <div class="feedback"></div>
  </div>`);
  const built=[]; const t0=Date.now();
  function redraw(){
    const b=$('sentBuild');
    b.innerHTML = built.length
      ? built.map((w,i)=>`<button class="sentWord picked" data-i="${i}">${esc(w)}</button>`).join('')
      : '<span class="sentHint">your sentence…</span>';
    b.querySelectorAll('.picked').forEach(el=>{
      el.onclick=()=>{
        const i=+el.dataset.i, w=built.splice(i,1)[0];
        const pool=$('sentPool');
        const btn=document.createElement('button');
        btn.className='sentWord'; btn.dataset.w=w; btn.textContent=w;
        btn.onclick=()=>takeWord(btn);
        pool.appendChild(btn); redraw();
      };
    });
  }
  function takeWord(btn){ built.push(btn.dataset.w); btn.remove(); redraw(); }
  c.querySelectorAll('#sentPool .sentWord').forEach(b=>{ b.onclick=()=>takeWord(b); });
  $('sentGo').onclick=()=>{
    const answer = built.join(' ');
    const right = answer===sentence;
    // Partial credit: proportion of words sitting in their correct slot.
    let inPlace=0;
    built.forEach((w,i)=>{ if(words[i]===w) inPlace++; });
    const secs=(Date.now()-t0)/1000;
    let score = right? 1 : clamp(inPlace/words.length, 0, 0.85);
    score *= clamp(1-Math.max(0,secs-45)/90, 0.6, 1);
    addScore('reasoning', score, 95); adaptSkill('reasoning');
    showFeedback(c, right, (right?'✅ Exactly right. ':`❌ Close — ${inPlace}/${words.length} words in the right slot.<br>The sentence was: <b>${esc(sentence)}</b>. `) +
      'Technique: anchor the verb first, then attach its subject and object. Syntax gives you far more constraints than word meaning does.');
  };
}

/* --- Paper Folding (mental spatial transformation) --- */
function chPaperFold(n,total){
  // Fold a square in half (once or twice), punch a hole, unfold: where are the holes?
  const folds = S.skill.visual>=6? 2 : 1;
  const G = 4;
  const holeR = 1 + rnd(2), holeC = rnd(2);           // punched in the top-left quadrant
  const set = new Set();
  set.add(holeR*G + holeC);
  set.add(holeR*G + (G-1-holeC));                      // mirror across the vertical fold
  if(folds===2){
    [...set].forEach(i=>{ const r=Math.floor(i/G), cc=i%G; set.add((G-1-r)*G + cc); });
  }
  const answer = [...set].sort((a,b)=>a-b);
  function gridSvg(cells, cls){
    return `<div class="foldGrid ${cls||''}">${Array.from({length:G*G},(_,i)=>
      `<div class="foldCell${cells.includes(i)?' hole':''}"></div>`).join('')}</div>`;
  }
  // Build 3 plausible distractors
  const opts=[answer];
  let guard=0;
  while(opts.length<4 && guard++<80){
    const alt = shuffle(Array.from({length:G*G},(_,i)=>i)).slice(0,answer.length).sort((a,b)=>a-b);
    if(!opts.some(o=>o.join()===alt.join())) opts.push(alt);
  }
  const shuffled = shuffle(opts);
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Paper Folding','Visual Memory')}
    <p class="big">A square sheet is folded ${folds===1?'in half (left over right)':'twice (left over right, then bottom over top)'},
      a hole is punched through, then it is unfolded. Which pattern of holes results?</p>
    <div class="foldStrip">
      <div class="foldStep">${gridSvg([holeR*G+holeC],'folded')}<span>punched</span></div>
      <div class="foldArrow">→</div>
      <div class="foldStep"><div class="foldQ">?</div><span>unfolded</span></div>
    </div>
    <div class="foldOpts">${shuffled.map((o,i)=>`<div class="foldOpt" data-i="${i}">${gridSvg(o)}</div>`).join('')}</div>
    <div class="feedback"></div>
  </div>`);
  const t0=Date.now();
  c.querySelectorAll('.foldOpt').forEach(el=>{
    el.onclick=()=>{
      if(c.querySelector('.foldOpt.correct')) return;
      const chosen = shuffled[+el.dataset.i];
      const right = chosen.join()===answer.join();
      c.querySelectorAll('.foldOpt').forEach((x,i)=>{
        if(shuffled[i].join()===answer.join()) x.classList.add('correct');
        else if(x===el) x.classList.add('wrong');
      });
      const secs=(Date.now()-t0)/1000;
      const score = right? clamp(1-Math.max(0,secs-20)/50, 0.5, 1) : 0;
      addScore('visual', score, 100); adaptSkill('visual');
      showFeedback(c, right, (right?'✅ Correct. ':'❌ Not that one. ') +
        `Each fold <b>doubles</b> the holes by mirroring them across the fold line — ${folds} fold${folds>1?'s':''} means ${answer.length} holes. ` +
        'Unfold one step at a time in your head rather than jumping to the final picture.');
    };
  });
}

/* --- Maze Route Planning --- */
function chMazeRoute(n,total){
  const size = clamp(5 + Math.floor(S.skill.visual/5), 5, 7);
  // Carve a perfect maze with randomised DFS, then ask for the shortest-path length.
  const walls = Array.from({length:size*size},()=>({n:true,e:true,s:true,w:true}));
  const seen = new Set([0]); const stack=[0];
  const dirs=[['n',-size,'s'],['e',1,'w'],['s',size,'n'],['w',-1,'e']];
  while(stack.length){
    const cur = stack[stack.length-1];
    const r=Math.floor(cur/size), cc=cur%size;
    const opts = dirs.filter(([d,off])=>{
      const nx=cur+off;
      if(nx<0||nx>=size*size) return false;
      if(d==='e'&&cc===size-1) return false;
      if(d==='w'&&cc===0) return false;
      return !seen.has(nx);
    });
    if(!opts.length){ stack.pop(); continue; }
    const [d,off,opp] = pick(opts);
    const nx=cur+off;
    walls[cur][d]=false; walls[nx][opp]=false;
    seen.add(nx); stack.push(nx);
  }
  // BFS for the true shortest path from top-left to bottom-right
  const goal = size*size-1;
  const dist = new Map([[0,0]]); const q=[0];
  while(q.length){
    const cur=q.shift(); const cc=cur%size;
    for(const [d,off] of dirs){
      if(walls[cur][d]) continue;
      const nx=cur+off;
      if(nx<0||nx>=size*size) continue;
      if(d==='e'&&cc===size-1) continue;
      if(d==='w'&&cc===0) continue;
      if(dist.has(nx)) continue;
      dist.set(nx, dist.get(cur)+1); q.push(nx);
    }
  }
  const shortest = dist.get(goal);
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Maze Route','Visual Memory')}
    <p class="big">Trace the route from 🟢 to 🏁 <b>with your eyes only</b> — no tapping the maze.
      How many steps is the shortest path? (Each move to an adjacent cell = 1 step.)</p>
    <div class="maze" id="maze" style="grid-template-columns:repeat(${size},minmax(0,1fr)); max-width:${size*54}px;">
      ${Array.from({length:size*size},(_,i)=>{
        const w=walls[i];
        const style = `border-top:${w.n?'3px solid var(--line)':'3px solid transparent'};`+
                      `border-right:${w.e?'3px solid var(--line)':'3px solid transparent'};`+
                      `border-bottom:${w.s?'3px solid var(--line)':'3px solid transparent'};`+
                      `border-left:${w.w?'3px solid var(--line)':'3px solid transparent'};`;
        return `<div class="mzCell" style="${style}">${i===0?'🟢':i===goal?'🏁':''}</div>`;
      }).join('')}
    </div>
    <input type="text" id="mzIn" inputmode="numeric" autocomplete="off" placeholder="number of steps">
    <div class="center mt"><button class="btn" id="mzGo">Submit</button></div>
    <div class="feedback"></div>
  </div>`);
  const t0=Date.now();
  function submit(){
    const g=parseInt($('mzIn').value,10);
    const off = isNaN(g)? 99 : Math.abs(g-shortest);
    const score = off===0? 1 : off===1? 0.6 : off===2? 0.3 : 0;
    const secs=(Date.now()-t0)/1000;
    addScore('visual', score * clamp(1-Math.max(0,secs-60)/120, 0.6, 1), 110);
    adaptSkill('visual');
    showFeedback(c, score>=0.6, `The shortest route is <b>${shortest}</b> steps — you said ${isNaN(g)?'nothing':g}. ` +
      'Trick: trace <i>backwards</i> from the finish. Dead ends are much easier to spot in reverse, ' +
      'because a perfect maze has exactly one path between any two cells.');
  }
  $('mzGo').onclick=submit;
  $('mzIn').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* --- Shape Fit (visual completion) --- */
function chShapeFit(n,total){
  const G=4;
  const total_ = G*G;
  // A random blob; the "missing piece" is the exact complement of one quadrant.
  const filled = new Set();
  const targetCount = 6+rnd(4);
  while(filled.size<targetCount) filled.add(rnd(total_));
  const pieceCells = [...filled].filter(()=>Math.random()<0.45);
  if(!pieceCells.length) pieceCells.push([...filled][0]);
  const remainder = [...filled].filter(i=>!pieceCells.includes(i));
  function mini(cells, cls){
    return `<div class="fitGrid ${cls||''}">${Array.from({length:total_},(_,i)=>
      `<div class="fitCell${cells.includes(i)?' on':''}"></div>`).join('')}</div>`;
  }
  const opts=[pieceCells.slice().sort((a,b)=>a-b)];
  let guard=0;
  while(opts.length<4 && guard++<60){
    const alt = shuffle(Array.from({length:total_},(_,i)=>i)).slice(0, pieceCells.length).sort((a,b)=>a-b);
    if(!opts.some(o=>o.join()===alt.join())) opts.push(alt);
  }
  const shuffled = shuffle(opts);
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Shape Fit','Visual Memory')}
    <p class="big">The target shape is on the left. Part of it is already placed. Which piece completes it <b>exactly</b>?</p>
    <div class="fitRow">
      <div class="fitBox">${mini([...filled],'target')}<span>target</span></div>
      <div class="fitBox">${mini(remainder,'partial')}<span>placed</span></div>
    </div>
    <div class="foldOpts">${shuffled.map((o,i)=>`<div class="foldOpt" data-i="${i}">${mini(o)}</div>`).join('')}</div>
    <div class="feedback"></div>
  </div>`);
  const answer = pieceCells.slice().sort((a,b)=>a-b).join();
  const t0=Date.now();
  c.querySelectorAll('.foldOpt').forEach(el=>{
    el.onclick=()=>{
      if(c.querySelector('.foldOpt.correct')) return;
      const right = shuffled[+el.dataset.i].join()===answer;
      c.querySelectorAll('.foldOpt').forEach((x,i)=>{
        if(shuffled[i].join()===answer) x.classList.add('correct'); else if(x===el) x.classList.add('wrong');
      });
      const secs=(Date.now()-t0)/1000;
      const score = right? clamp(1-Math.max(0,secs-15)/40, 0.5, 1) : 0;
      addScore('visual', score, 95); adaptSkill('visual');
      showFeedback(c, right, (right?'✅ Perfect fit. ':'❌ That leaves gaps or overlaps. ') +
        'Do not compare whole shapes — compare <i>one distinctive cell</i>, usually a lone corner square. ' +
        'A single mismatched cell eliminates an option instantly.');
    };
  });
}

/* --- Number Logic Grid (constraint deduction) --- */
function chLogicGrid(n,total){
  const people = sample(NAMES, 3);
  const items = sample(['a violin','a telescope','a bicycle','a camera','a chess set','a guitar'], 3);
  const perm = shuffle([0,1,2]);
  const owns = {};                       // people[i] owns items[perm[i]]
  people.forEach((p,i)=>{ owns[p]=items[perm[i]]; });
  // Generate clues that are true of this arrangement, then verify uniqueness.
  const allClues = [];
  people.forEach(p=>{
    items.forEach(it=>{
      if(owns[p]!==it) allClues.push({text:`${p} does not own ${it}.`, test:a=>a[p]!==it});
    });
  });
  people.forEach(p=>{ allClues.push({text:`${p} owns ${owns[p]}.`, test:a=>a[p]===owns[p]}); });
  function permutations(arr){
    if(arr.length<=1) return [arr];
    return arr.flatMap((x,i)=>permutations([...arr.slice(0,i),...arr.slice(i+1)]).map(r=>[x,...r]));
  }
  const worlds = permutations(items).map(order=>{
    const a={}; people.forEach((p,i)=>{ a[p]=order[i]; }); return a;
  });
  // Pick the smallest clue set (2-4) that pins down exactly one world.
  let clues=null;
  for(let attempt=0; attempt<120 && !clues; attempt++){
    const size = 2 + (attempt%3);
    const trial = sample(allClues.filter(c=>!c.text.includes(' owns ')), size);
    const fits = worlds.filter(w=>trial.every(c=>c.test(w)));
    if(fits.length===1) clues=trial;
  }
  if(!clues){ return chSyllogism(n,total); }
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Logic Grid','Reasoning')}
    <p class="big">Three people, three possessions, one each. Work out who owns what.</p>
    <div class="logicBox">${clues.map(x=>`<p class="logicLine">• ${esc(x.text)}</p>`).join('')}</div>
    <div id="lgRows">${people.map(p=>`
      <div class="lgRow">
        <span class="lgName">${esc(p)}</span>
        <select class="lgSel" data-p="${esc(p)}">
          <option value="">— choose —</option>
          ${items.map(it=>`<option value="${esc(it)}">${esc(it)}</option>`).join('')}
        </select>
      </div>`).join('')}</div>
    <div class="center mt"><button class="btn" id="lgGo">Check</button></div>
    <div class="feedback"></div>
  </div>`);
  const t0=Date.now();
  $('lgGo').onclick=()=>{
    let correct=0;
    c.querySelectorAll('.lgSel').forEach(sel=>{
      const p=sel.dataset.p;
      if(sel.value===owns[p]) correct++;
    });
    const score = correct/people.length;
    const secs=(Date.now()-t0)/1000;
    addScore('reasoning', score * clamp(1-Math.max(0,secs-50)/100, 0.6, 1), 105);
    adaptSkill('reasoning');
    showFeedback(c, score>=0.99, `${correct} of ${people.length} correct. Answer: ` +
      people.map(p=>`<b>${esc(p)}</b> — ${esc(owns[p])}`).join(', ') + '. ' +
      'Negative clues are the powerful ones: cross out possibilities on a grid rather than trying to hold them in your head. ' +
      'Once a row or column has one option left, it is forced.');
  };
}

  const SETS = [

    {words:['square','rhombus','triangle','rectangle'], odd:'triangle', why:'the only one without four sides'},

    {words:['Saturn','Jupiter','Titan','Uranus'], odd:'Titan', why:'the only moon — the rest are planets'}
  ];
  const s = pick(SETS);
  const order = shuffle(s.words);
  const c = screen(`<div class="card">
    ${challengeHeader(n,total,'Odd Word Out','Reasoning')}
    <p class="big">Three of these share a category. Which one breaks the pattern?</p>
    <div class="choices">${order.map(w=>`<div class="choice" data-w="${esc(w)}">${esc(w)}</div>`).join('')}</div>
    <div class="feedback"></div>
  </div>`);
  const t0=Date.now();
  c.querySelectorAll('.choice').forEach(el=>{
    el.onclick=()=>{
      if(c.querySelector('.choice.correct')) return;
      const right = el.dataset.w===s.odd;
      c.querySelectorAll('.choice').forEach(x=>{
        if(x.dataset.w===s.odd) x.classList.add('correct'); else if(x===el) x.classList.add('wrong');
      });
      const secs=(Date.now()-t0)/1000;
      const score = right? clamp(1-Math.max(0,secs-10)/30, 0.5, 1) : 0;
      addScore('reasoning', score, 80); adaptSkill('reasoning');
      showFeedback(c, right, (right?'✅ ':'❌ ') + `<b>${esc(s.odd)}</b> is the odd one — ${esc(s.why)}. ` +
        'When you are stuck, state the rule for the three you are confident about <i>out loud</i>. ' +
        'A rule you can articulate is a rule you can test.');
    };
  });
}

/* ================= RESULTS ================= */
function results(){
  clearPersistedSession();
  session.missionDone = evaluateMission();   // final, authoritative check
  const cats = ['memory','visual','focus','calc','reasoning','reaction','flexibility'];
  const catNames = {memory:'Memory', visual:'Visual Memory', focus:'Focus', calc:'Calculation', reasoning:'Reasoning', reaction:'Reaction', flexibility:'Flexibility'};
  const catScores = {};
  cats.forEach(ct=>{
    const arr = session.scores[ct];
    catScores[ct] = arr.length? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*100) : null;
  });
  const present = cats.filter(ct=>catScores[ct]!=null);
  // Guard against an empty session (every challenge skipped) producing NaN.
  if(!present.length){
    screen(`<div class="card center"><h1>No scores recorded</h1>
      <p class="big">That session had nothing to grade — nothing was saved.</p>
      <button class="btn" onclick="intro()">Back to Home</button></div>`);
    return;
  }
  const brain = Math.round(present.reduce((a,ct)=>a+catScores[ct],0)/present.length);
  const mins = Math.max(1, Math.round((Date.now()-session.startedAt)/60000));

  // history + streak
  const t = todayStr();
  const prev = S.history.length? S.history[S.history.length-1] : null;
  const firstToday = S.lastPlayed !== t;
  if(firstToday){ S.streak += 1; }
  S.lastPlayed = t; S.sessionsPlayed += 1;
  S.history.push({date:t, brain, cats:catScores});
  if(S.history.length>90) S.history = S.history.slice(-90);

  // bests & achievements
  /* BUGFIX: achievements are now stored as stable IDs, not display strings.
     The old code matched trophies with x.includes(name), so unlocking
     "7-Day Streak — Focus Champion" also falsely unlocked the separate
     "Focus Champ" (90+ focus score) trophy. It also pushed the new-record
     trophy straight to newAch without ever saving it, so "New Record"
     could never show as unlocked. */
  const newAch = [];
  function ach(id){ if(!S.achievements.includes(id)){ S.achievements.push(id); newAch.push(id); } }
  if(!S.bests.brain || brain>S.bests.brain){
    S.bests.brain = brain;
    if(S.sessionsPlayed>1) ach('record');
  }
  if(S.sessionsPlayed===1) ach('first');
  if(S.streak>=3) ach('streak3');
  if(S.streak>=7) ach('streak7');
  if(S.streak>=30) ach('streak30');
  if(session.perfects>=1) ach('perfect');
  if(catScores.calc!=null && catScores.calc>=90) ach('calc90');
  if(catScores.focus!=null && catScores.focus>=90) ach('focus90');
  if(brain>=90) ach('titan');
  if(S.freePlayCount>=25) ach('explorer');
  if(Object.keys(S.playedGames||{}).length>=20) ach('polymath');
  const hr = new Date().getHours();
  if(hr>=23 || hr<4) ach('nightowl');
  if(hr>=4 && hr<7) ach('earlybird');
  if(session.missionDone){ S.xp += 50; S.coins += 20; }
  S.focusPoints += 10 + (session.missionDone?5:0);
  save();

  const delta = prev? brain - prev.brain : null;
  const weak = present.slice().sort((a,b)=>catScores[a]-catScores[b])[0];
  const recs = {
    memory:'Tomorrow, build your memory palace BEFORE the list appears — pre-loading loci is the #1 accelerator.',
    visual:'Practice "shape naming": describe any pattern aloud in words. Do it with real objects today (a shelf, a parking lot).',
    focus:'Your Stroop scores rise fastest with single-tasking practice: one 25-minute phone-free block today.',
    calc:'Drill one times-table family (e.g., 17×) for 3 minutes tonight — targeted drilling beats general practice.',
    reasoning:'Before answering, verbalize the RULE, not the answer. Rule-first thinking is what improves reasoning scores.',
    reaction:'Reaction improves with rest — check your sleep tonight; 7+ hours is worth 20ms.',
    flexibility:'Switching cost shrinks with practice at BOUNDARIES: today, alternate two small tasks in 5-min blocks instead of finishing one then the other.'
  };
  const detoxMin = [15,30,45,60,90,120][clamp(Math.floor(S.streak/3),0,5)];

  screen(`
    <div class="card center">
      <h3>Session Complete · ${mins} min</h3>
      <h1>🧠 Brain Score</h1>
      <div class="bigNum" style="font-size:64px; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;">${brain}</div>
      <p class="big">${delta==null? 'Baseline set — everything from here is growth.' : delta>=0? '▲ +'+delta+' vs last session' : '▼ '+delta+' vs last session (dips are part of training)'}</p>
      ${session.missionDone
        ? `<span class="badge">✅ Mission complete +50 XP</span><p style="font-size:13px; margin-top:8px;">“${esc(missionById(session.mission).text)}”</p>`
        : `<span class="pill">Mission missed</span><p style="font-size:13px; margin-top:8px;">“${esc(missionById(session.mission).text)}” — new one tomorrow.</p>`}
    </div>
    <div class="card">
      <h3>Skill Breakdown</h3>
      ${present.map(ct=>`<div class="scorebar"><div class="name">${catNames[ct]}</div><div class="track"><div class="fill" style="width:${catScores[ct]}%"></div></div><div class="val">${catScores[ct]}</div></div>`).join('')}
      <p class="mt">💡 <b>Tomorrow's focus (${catNames[weak]}):</b> ${recs[weak]}</p>
    </div>
    ${newAch.length? `<div class="card"><h3>🎉 Unlocked</h3>${achBadges(newAch)}</div>` : ''}
    <div class="card">
      <h3>🧘 Anti-Doomscroll Mission</h3>

let detoxIv = null;
function startDetox(min){
  if(detoxIv) clearInterval(detoxIv);
  let left = min*60;
  screen(`<div class="card center">
    <h2>🧘 Detox in progress</h2>
    <div class="bigNum" id="dtTime" style="font-size:56px">--:--</div>
    <p>Keep this tab open. Go read something, stretch, or just think. If you leave to scroll, restart honestly — you're only training yourself.</p>
    <button class="btn secondary" onclick="cancelDetox()">Give up (no points)</button>
  </div>`);
  function tick(){
    const m = Math.floor(left/60), s = left%60;
    const el = document.getElementById('dtTime');
    if(el) el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(left<=0){
      clearInterval(detoxIv); detoxIv=null;
      S.focusPoints += min; save();
      screen(`<div class="card center"><h1>🎉 Detox complete!</h1><p class="big">+${min} Focus Points. That's ${min} minutes your attention span got stronger and the algorithm got weaker.</p>
      <button class="btn" onclick="intro()">Home</button></div>`);
      return;
    }
    left--;
  }
  tick();
  detoxIv = startInterval(tick, 1000);
}
function cancelDetox(){ if(detoxIv) clearInterval(detoxIv); detoxIv=null; intro(); }

let AC=null;
function sfx(freq, dur=0.06, type='triangle', vol=0.12){
  if(!S.prefs.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.start(); o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
function haptic(ms){ if(S.prefs.haptics && navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }
document.addEventListener('pointerdown', (e)=>{

  if(!t) return;
  const ok = !t.classList.contains('wrong') && !t.classList.contains('err');
  sfx(ok?560:180, 0.05, ok?'triangle':'sawtooth', 0.09); haptic(ok?8:20);
}, {passive:true});

/* ================= KEYBOARD CONTROL ================= */
/* Every screen is now driveable from a keyboard:
   Enter / Space  → primary action (submit, next challenge)
   1-6            → pick the nth multiple-choice option
   Esc            → home */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || tag==='select';

  if(e.key==='Escape'){
    e.preventDefault();
    if(session && !session.free && !confirm('Leave this session? Your progress is saved and you can resume.')) return;
    navGo('home'); return;
  }
  if(typing) return;                       // let inputs handle their own keys

  if(/^[1-9]$/.test(e.key)){
    const opts = [...app.querySelectorAll('.choice, .foldOpt, .shapeOpt')]
      .filter(el=>!el.classList.contains('correct') && !el.classList.contains('wrong'));
    const el = opts[+e.key-1];
    if(el){ e.preventDefault(); el.click(); }
    return;
  }
  if(e.key==='Enter' || e.key===' '){
    // Prefer a visible feedback "continue" button, else the first enabled primary button.
    const fb = app.querySelector('.feedback.good .btn, .feedback.bad .btn');
    const btn = fb || [...app.querySelectorAll('.btn')].find(b=>!b.disabled);
    if(btn){ e.preventDefault(); btn.click(); }
  }
});

/* Backup / restore — progress lives only in localStorage, so give people a way out. */
function exportProgress(){
  try{
    const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'neuroforge-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Backup downloaded');
  }catch(e){ toast('Could not export'); }
}
function importProgress(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const obj = JSON.parse(fr.result);
        if(typeof obj!=='object' || obj===null || !('xp' in obj)) throw new Error('not a NeuroForge backup');
        if(!confirm('Replace your current progress with this backup?')) return;
        localStorage.setItem('neuroforge', JSON.stringify(obj));
        location.reload();
      }catch(err){ alert('That file could not be read as a NeuroForge backup.'); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

const ACH_CATALOG = [
  {id:'first',    ic:'🎖', n:'First Steps',      d:'Finish your first session'},
  {id:'streak3',  ic:'🔥', n:'3-Day Streak',     d:'Train 3 days running'},
  {id:'streak7',  ic:'🔥', n:'Week Warrior',     d:'7-day streak'},
  {id:'streak30', ic:'👑', n:'Memory Master',    d:'30-day streak'},
  {id:'perfect',  ic:'💎', n:'Perfect Recall',   d:'100% on a challenge'},
  {id:'calc90',   ic:'🧮', n:'Calculation King', d:'90+ calculation score'},
  {id:'focus90',  ic:'🎯', n:'Focus Champ',      d:'90+ focus score'},
  {id:'titan',    ic:'🧠', n:'Brain Titan',      d:'Brain score 90+'},
  {id:'record',   ic:'🏆', n:'New Record',       d:'Beat your best brain score'},
  {id:'explorer', ic:'🧭', n:'Explorer',         d:'Play 25 Free Play rounds'},
  {id:'polymath', ic:'🎓', n:'Polymath',         d:'Try 20 different games'},
  {id:'nightowl', ic:'🦉', n:'Night Owl',        d:'Train after 11pm'},
  {id:'earlybird',ic:'🐓', n:'Early Bird',       d:'Train before 7am'}
];
/* Legacy save files stored full display strings ("🎖 First Steps"). Map them
   onto the new stable IDs once, so nobody loses trophies on upgrade. */
const ACH_LEGACY = {'First Steps':'first','3-Day Streak':'streak3','7-Day Streak':'streak7',
  '30-Day Streak':'streak30','Perfect Recall':'perfect','Calculation King':'calc90',
  'Brain Titan':'titan','New Best Brain Score':'record'};
(function migrateAchievements(){
  if(!Array.isArray(S.achievements)) { S.achievements = []; return; }
  const ids = new Set();
  const known = new Set(ACH_CATALOG.map(a=>a.id));
  S.achievements.forEach(entry=>{
    if(known.has(entry)){ ids.add(entry); return; }
    for(const [text,id] of Object.entries(ACH_LEGACY)){
      if(String(entry).includes(text)) ids.add(id);
    }
  });
  S.achievements = [...ids];
})();
function hasAch(id){ return S.achievements.includes(id); }
function achievementsScreen(){
  setNav('awards');
  const unlocked = ACH_CATALOG.filter(a=>hasAch(a.id));
  const cards = ACH_CATALOG.map(a=>{
    const got = hasAch(a.id);
    return `<div class="achCard${got?'':' locked'}" style="${got?'background:var(--yellow);':''}"><div class="ai">${a.ic}</div><div class="an">${a.n}</div><div class="ad">${got?'Unlocked':'🔒 '+a.d}</div></div>`;
  }).join('');
  screen(`
    <div class="card"><h1>🏆 Trophy case</h1>
      <p>${unlocked.length} of ${ACH_CATALOG.length} unlocked</p>
      <div class="timerbar" style="height:14px"><div style="width:${Math.round(unlocked.length/ACH_CATALOG.length*100)}%"></div></div>
    </div>
    <div class="card"><div class="achGrid">${cards}</div></div>
    <div class="card center"><h3>Keep going</h3><p>Train daily to unlock streak trophies and push your rank from <b>${rank()}</b> upward.</p>
      <button class="btn" onclick="navGo('play')">▶ Train now</button></div>
  `);
}

/* ================= INSIGHTS SCREEN ================= */
function insightsScreen(){
  setNav('insights');
  const cats=['memory','visual','focus','calc','reasoning','reaction','flexibility'];
  const names={memory:'Memory',visual:'Visual',focus:'Focus',calc:'Calc',reasoning:'Reasoning',reaction:'Reaction',flexibility:'Flex'};
  const emoji={memory:'🧠',visual:'👁',focus:'🎯',calc:'🧮',reasoning:'🧩',reaction:'⚡',flexibility:'🔄'};
  const cols={memory:'var(--accent)',visual:'var(--accent2)',focus:'var(--pink)',calc:'var(--yellow)',reasoning:'#b07bff',reaction:'var(--lime)',flexibility:'#ff9d5c'};
  // averages from history, fallback to skill level *8
  const avg = {};
  cats.forEach(ct=>{
    const vals = S.history.map(h=>h.cats&&h.cats[ct]).filter(v=>v!=null);
    avg[ct] = vals.length? Math.round(vals.slice(-7).reduce((a,b)=>a+b,0)/Math.min(vals.length,7)) : Math.round(S.skill[ct]*8);
  });
  const present = cats.filter(ct=>avg[ct]!=null);
  const overall = Math.round(present.reduce((a,ct)=>a+avg[ct],0)/present.length);
  const gradeOf=v=>v>=90?'S':v>=80?'A':v>=68?'B':v>=55?'C':'D';
  const sorted = present.slice().sort((a,b)=>avg[b]-avg[a]);
  const strong=sorted[0], weak=sorted[sorted.length-1];
  // conic wheel
  let acc=0; const seg = present.map(ct=>{ const frac=avg[ct]/present.reduce((s,c)=>s+avg[c],0); const a0=acc*360, a1=(acc+frac)*360; acc+=frac; return `${cols[ct]} ${a0}deg ${a1}deg`; }).join(',');
  const hist = S.history.slice(-14);
  const chart = hist.length? `<div class="chart">${hist.map(h=>`<div class="bar" style="height:${Math.max(5,h.brain)}%"><span>${h.brain}</span></div>`).join('')}</div>` :
    `<p class="center">Play a few sessions to see your brain-score trend build here.</p>`;
  screen(`
    <div class="card center">
      <h1>📊 Skill insights</h1>
      <div style="width:180px; height:180px; margin:14px auto 6px; border-radius:50%; background:conic-gradient(${seg}); display:flex; align-items:center; justify-content:center; border:var(--bw) solid var(--line); box-shadow:var(--card-sh);">
        <div style="width:104px; height:104px; border-radius:50%; background:var(--panel); border:var(--bw) solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <div class="bigNum" style="margin:0; font-size:34px;">${gradeOf(overall)}</div><div class="d" style="font-size:11px; color:var(--dim)">grade · ${overall}</div>
        </div>
      </div>
      <div class="statgrid" style="grid-template-columns:1fr 1fr;">
        <div class="stat" style="background:var(--lime)"><div class="v">${emoji[strong]} ${names[strong]}</div><div class="l">Strongest · ${avg[strong]}</div></div>
        <div class="stat" style="background:var(--pink)"><div class="v">${emoji[weak]} ${names[weak]}</div><div class="l">Focus area · ${avg[weak]}</div></div>
      </div>
    </div>
    <div class="card"><h3>Per-skill level</h3>
      ${cats.map(ct=>`<div class="scorebar"><div class="name">${emoji[ct]} ${names[ct]}</div><div class="track"><div class="fill" style="width:${avg[ct]}%; background:${cols[ct]}"></div></div><div class="val">${avg[ct]}</div></div>`).join('')}
    </div>
    <div class="card"><h3>Brain score trend</h3>${chart}
      <p class="mt">💡 Sessions automatically weight extra practice toward <b>${names[weak]}</b>, your current growth area.</p>
    </div>
  `);
}
